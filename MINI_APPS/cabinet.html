<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой участок — СНТ Берёзка-4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <h1>Мой участок</h1>
    <button class="back-btn" id="refreshBtn" onclick="loadCabinet()" title="Обновить" style="margin-left:auto">&#8635;</button>
  </div>

  <div class="container">
    <div id="cabinetContainer">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    async function loadCabinet() {
      const container  = document.getElementById('cabinetContainer');
      const refreshBtn = document.getElementById('refreshBtn');
      container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      if (refreshBtn) refreshBtn.disabled = true;

      try {
        const data = await SNT.getCabinet();

        if (!data || data.registered === false) {
          SNT.saveUser(null);
          container.innerHTML = `
            <div class="alert alert-info">
              Вы не зарегистрированы в системе СНТ.
            </div>
            <a href="register.html" class="btn btn-primary mt-16">Зарегистрироваться</a>
          `;
          return;
        }

        if (!data.plot_number && !data.plot) {
          container.innerHTML = `
            <div class="alert alert-error">
              Данные по вашему участку не найдены. Обратитесь в правление СНТ.
            </div>
            <a href="index.html" class="btn btn-outline mt-16">На главную</a>
          `;
          return;
        }

        const plotNumber = data.plot_number || data.plot || '—';
        const balance    = data.balance || data['Задолженность'] || data['Долг'] || '0';
        const balanceNum = parseFloat(String(balance).replace(',', '.')) || 0;
        const debtClass  = balanceNum > 0 ? 'debt-positive' : 'debt-zero';
        const debtLabel  = balanceNum > 0 ? `${balance} руб.` : 'Нет задолженности';

        container.innerHTML = `
          <div class="cabinet-card">
            <div class="field-label">Номер участка</div>
            <div class="field-value">${escapeHtml(String(plotNumber))}</div>
          </div>

          <div class="cabinet-card">
            <div class="field-label">Задолженность</div>
            <div class="field-value ${debtClass}">${escapeHtml(debtLabel)}</div>
          </div>

          ${balanceNum > 0 ? `
            <div class="alert alert-error">
              Пожалуйста, погасите задолженность. По вопросам оплаты обращайтесь в правление СНТ.
            </div>
          ` : `
            <div class="alert alert-success">
              Задолженность отсутствует. Спасибо!
            </div>
          `}

          <div class="divider"></div>
          <p class="text-muted text-center">
            Данные актуальны на дату последнего обновления реестра.<br>
            Сайт: <a href="https://sntberezka4.ru" target="_blank" style="color:#388e3c">sntberezka4.ru</a>
          </p>
        `;

      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-error">
            Не удалось загрузить данные участка. Попробуйте позже.
          </div>
        `;
        console.error(err);
      } finally {
        if (refreshBtn) refreshBtn.disabled = false;
      }
    }

    loadCabinet();
  </script>

</body>
</html>
